<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkmate</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js" defer></script>
    <script src="js/data.js" defer></script>
    <script src="js/ui.js" defer></script>
    <script src="js/filter.js" defer></script>
</head>

<body>
    <div class="container">
        <header>
            <h1>Checkmate</h1>
        </header>

        <main>
            <div class="search-container">
                <input type="search" id="search-input" placeholder="Search games" class="search-input">
                <select id="predefined-search" class="predefined-select">
                    <option value="">Sort by</option>
                    <option value="name">Name (A-Z)</option>
                    <option value="time">Playing time (Shortest first)</option>
                    <option value="difficulty">Difficulty (Easiest first)</option>
                    <option value="players">Number of players (Fewest first)</option>
                </select>

                <button id="filter-toggle" class="filter-button">
                    <span>Filter</span>
                </button>
            </div>

            <!-- Filter panel -->
            <div id="filter-panel" class="filter-panel">
                <div class="filter-header">
                    <h2>Filter</h2>
                    <button id="filter-close" class="filter-close">&times;</button>
                </div>

                <!--Filter content-->
                <div class="filter-content">

                    <!-- Players -->
                    <div class="filter-group">
                        <label class="filter-label">Players</label>

                        <div class="players-group">
                            <label class="players-label">
                                <input type="radio" name="players" value="1">
                                1
                            </label>

                            <label class="players-label">
                                <input type="radio" name="players" value="2">
                                2
                            </label>

                            <label class="players-label">
                                <input type="radio" name="players" value="3">
                                3
                            </label>

                            <label class="players-label">
                                <input type="radio" name="players" value="4">
                                4
                            </label>

                            <label class="players-label">
                                <input type="radio" name="players" value="5">
                                5
                            </label>

                            <label class="players-label">
                                <input type="radio" name="players" value="6">
                                6+
                            </label>
                        </div>
                    </div>

                    <!-- Playing time -->
                    <div class="filter-group">
                        <label for="playing-time" class="filter-label">Playing time</label>

                        <div class="time-group">
                            <span id="time-value">Up to 60 min</span>

                            <input type="range" id="playing-time" min="15" max="120" value="60" step="15">

                            <div class="time-labels">
                                <span>15 min</span>
                                <span>120+ min</span>
                            </div>
                        </div>
                    </div>

                    <!--Category-->
                    <div class="filter-group">
                        <label class="filter-label">Category</label>
                        <div class="checkbox-group">

                            <label class="checkbox-label">
                                <input type="checkbox" name="category" value="party-game">
                                Party Game
                            </label>

                            <label class="checkbox-label">
                                <input type="checkbox" name="category" value="card-game">
                                Card Game
                            </label>

                            <label class="checkbox-label">
                                <input type="checkbox" name="category" value="trivia">
                                Trivia
                            </label>

                            <label class="checkbox-label">
                                <input type="checkbox" name="category" value="strategy">
                                Strategy
                            </label>

                            <label class="checkbox-label">
                                <input type="checkbox" name="category" value="board-game">
                                Board Game
                            </label>

                            <label class="checkbox-label">
                                <input type="checkbox" name="category" value="dice">
                                Dice
                            </label>

                            <label class="checkbox-label">
                                <input type="checkbox" name="category" value="mature-adult">
                                Mature/Adult
                            </label>

                        </div>
                    </div>
                </div>

                <div class="filter-footer">
                    <button id="apply-filters" class="apply-button">Show games</button>
                </div>



            </div>

            <section class="game-list" id="game-list">
                <!-- Game cards will be dynamically inserted here -->
            </section>


        </main>
        <footer>
            <p>© 2026 Checkmate</p>
        </footer>



    </div>
    <dialog id="game-dialog">
        <article class="dialog-content">
            <img id="dialog-image" src="" alt="" class="game-image">
            <h2 id="dialog-title"></h2>
            <p id="dialog-description"></p>

            <div class="game-meta">
                <span id="dialog-players" class="game-players"></span>
                <span id="dialog-time" class="game-time"></span>
                <span id="dialog-category" class="game-category"></span>

            </div>

            <div id="dialog-difficulty" class="game-difficulty"></div>
            <menu class="dialog-actions">
                <button id="dialog-close" value="cancel">Close</button>
            </menu>
        </article>
    </dialog>
    <div id="overlay" class="overlay"></div>
</body>

</html>
